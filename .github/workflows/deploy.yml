name: Deploy to DreamHost

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public
          destination: ./_site
      - name: rsync deploy
        uses: easingthemes/ssh-deploy@v6.0.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DH_HOST }}
          REMOTE_USER: ${{ secrets.DH_USERNAME }}
          SOURCE: _site/
          TARGET: pilgrimagesoftware.com/
          ARGS: -rlgoDzvc -i --delete
          EXCLUDE: CNAME
