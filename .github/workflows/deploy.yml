name: Deploy to DreamHost

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: SFTP upload
        uses: Dylan700/sftp-upload-action@v1.2.4
        with:
          server: ${{ secrets.DH_HOST }}
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_PASSWORD }}
          port: 22
          uploads: |
            ./public/ => ./pilgrimagesoftware.com/public/
          ignore: |
            *.git
            */**/*git*
